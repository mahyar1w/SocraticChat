name: Build & Release AppImage + Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (e.g. v0.1.0 or latest)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build Linux AppImage (CPU + Vulkan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: socratic-chat

      - name: Install build dependencies (Vulkan, CMake, egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev glslc spirv-headers libssl-dev libcurl4-openssl-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            file

      - name: Build llama-server (CPU + Vulkan) from submodule
        run: |
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build llama.cpp/build --target llama-server -j"$(nproc)"

      - name: Build socratic-chat (release)
        working-directory: socratic-chat
        run: |
          cargo test -- --skip test_live_llama_cpp_roundtrip
          cargo build --release

      - name: Assemble SocraticChat.AppDir
        run: |
          mkdir -p SocraticChat.AppDir/usr/bin SocraticChat.AppDir/usr/lib
          cp socratic-chat/target/release/socratic-chat SocraticChat.AppDir/usr/bin/
          cp llama.cpp/build/bin/llama-server SocraticChat.AppDir/usr/bin/
          cp -a llama.cpp/build/bin/lib*.so* SocraticChat.AppDir/usr/lib/ 2>/dev/null || true
          find llama.cpp/build -maxdepth 4 -name 'lib*.so*' -exec cp -a {} SocraticChat.AppDir/usr/lib/ \;

          cp packaging/socratic-chat.desktop SocraticChat.AppDir/
          cp packaging/socratic-chat.svg SocraticChat.AppDir/

          cat <<'EOF' > SocraticChat.AppDir/AppRun
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          exec "${HERE}/usr/bin/socratic-chat" "$@"
          EOF
          chmod +x SocraticChat.AppDir/AppRun \
            SocraticChat.AppDir/usr/bin/socratic-chat \
            SocraticChat.AppDir/usr/bin/llama-server

      - name: Package AppImage
        run: |
          curl -fSL -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            SocraticChat.AppDir SocraticChat-x86_64.AppImage
          ls -lh SocraticChat-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocraticChat-x86_64.AppImage
          path: SocraticChat-x86_64.AppImage

  build-android-apk:
    name: Build Android APK (arm64-v8a CPU + Vulkan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install host Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build glslc spirv-headers

      - name: Cross-compile llama-server for Android arm64-v8a (CPU + Vulkan)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          SYSROOT="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp.git Vulkan-Hpp
          cmake -S llama.cpp -B llama.cpp/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-isystem ${PWD}/Vulkan-Hpp" \
            -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DVulkan_GLSLC_EXECUTABLE="$(which glslc)" \
            -DVulkan_INCLUDE_DIR="${SYSROOT}/usr/include" \
            -DVulkan_LIBRARY="${SYSROOT}/usr/lib/aarch64-linux-android/28/libvulkan.so"
          cmake --build llama.cpp/build-android --target llama-server -j"$(nproc)"
          "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" llama.cpp/build-android/bin/llama-server

      - name: Bundle llama-server into jniLibs
        run: |
          JNIDIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "${JNIDIR}"
          cp llama.cpp/build-android/bin/llama-server "${JNIDIR}/libllama_server.so"
          ls -lh "${JNIDIR}"

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../SocraticChat-arm64-v8a.apk
          ls -lh ../SocraticChat-arm64-v8a.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocraticChat-arm64-v8a.apk
          path: SocraticChat-arm64-v8a.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-appimage, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'latest' }}
          files: |
            dist/SocraticChat-x86_64.AppImage
            dist/SocraticChat-arm64-v8a.apk
          generate_release_notes: true
